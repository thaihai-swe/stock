name: Scheduled Stock Fundamentals Sync (Python)

on:
  schedule:
    # Chạy tự động lúc 18:00 (Giờ Việt Nam, tức 11:00 UTC) từ Thứ 2 đến Thứ 6 sau khi kết thúc phiên giao dịch
    - cron: '0 11 * * 1-5'
    # Nếu muốn chạy hàng tuần vào chiều Thứ 6: thay bằng '0 11 * * 5'
  
  workflow_dispatch:
    # Nút bấm kích hoạt thủ công trực tiếp từ giao diện GitHub Actions
    inputs:
      reason:
        description: 'Lý do kích hoạt đồng bộ'
        required: false
        default: 'Manual trigger from GitHub UI'

# Cấp quyền ghi commit cho bot GitHub Actions
permissions:
  contents: write

jobs:
  sync-fundamentals:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 2. Cài đặt Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ 3. Chạy Python Background Sync (50+ Chỉ Số Định Giá)
        run: python scripts/sync_fundamentals.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 💾 4. Tự động Commit & Push dữ liệu Cache mới về Kho lưu trữ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals_cache.json
          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi dữ liệu định giá mới."
          else
            git commit -m "chore(data): auto sync fundamental metrics via Python [skip ci]"
            git push
            echo "✅ Đã commit và push dữ liệu mới lên GitHub thành công!"
          fi

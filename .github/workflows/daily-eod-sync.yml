name: Daily EOD Stock Fundamentals & Macro Sync (Python)

on:
  schedule:
    # Chạy tự động lúc 18:00 (Giờ Việt Nam, tức 11:00 UTC) từ Thứ 2 đến Thứ 6 sau khi sàn đóng cửa
    - cron: '0 11 * * 1-5'

  workflow_dispatch:
    # Nút bấm kích hoạt thủ công từ GitHub Actions UI
    inputs:
      reason:
        description: 'Lý do kích hoạt đồng bộ EOD'
        required: false
        default: 'Manual trigger Daily EOD'

permissions:
  contents: write

jobs:
  daily-eod-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 2. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 3. Cài đặt dependencies với uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system pandas requests beautifulsoup4 yfinance curl_cffi lxml numpy

      - name: ⚡ 4. Chạy Daily EOD Pipeline
        run: python scripts/run_pipeline.py --cadence daily
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL || vars.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || vars.OPENROUTER_MODEL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || vars.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL }}

      - name: 💾 5. Tự động Commit & Push dữ liệu Cache EOD mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage toàn bộ các file cache dữ liệu hợp lệ được cập nhật
          git add data/fundamentals_cache.json \
                  data/macro_valuation.json \
                  data/financials/ \
                  data/supported_stocks.json \
                  data/requested_stocks.json \
                  data/ai_insights_cache.json \
                  data/portfolio_ai_insights.json \
                  data/market_valuation_history.json \
                  data/macro_indicators.json \
                  data/sector_valuation_cache.json \
                  data/vnindex_valuation_cache/ 2>/dev/null || true
                  
          # Hoàn tác và làm sạch các thay đổi unstaged còn sót lại (như data/prices_cache.json) để đảm bảo working tree sạch 100%
          git checkout -- . 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi dữ liệu EOD mới."
          else
            git commit -m "chore(data): daily EOD market & fundamentals sync [skip ci]"
            if ! git pull --rebase origin main; then
              echo "⚠️ Rebase không thành công, tự động hủy rebase và chuyển sang chiến lược pull merge..."
              git rebase --abort 2>/dev/null || true
              git pull -X theirs --no-edit origin main
            fi
            git push origin main
            echo "✅ Đã commit và push dữ liệu EOD mới lên GitHub thành công!"
          fi

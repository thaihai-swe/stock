name: Weekly Macro & Sector Valuation Sync (Python)

on:
  schedule:
    # Chạy tự động lúc 10:00 Sáng (Giờ Việt Nam, tức 03:00 UTC) vào Thứ Bảy hằng tuần
    - cron: '0 3 * * 6'

  workflow_dispatch:
    # Nút bấm kích hoạt thủ công từ GitHub Actions UI
    inputs:
      reason:
        description: 'Lý do kích hoạt đồng bộ Macro Weekly'
        required: false
        default: 'Manual trigger Weekly Macro'

permissions:
  contents: write

jobs:
  weekly-macro-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 2. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 3. Cài đặt dependencies với uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system pandas requests beautifulsoup4 yfinance curl_cffi lxml numpy

      - name: ⚡ 4. Chạy Weekly Macro & Sector Pipeline
        run: python scripts/run_pipeline.py --cadence weekly
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 💾 5. Tự động Commit & Push dữ liệu Macro & Sector mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro_indicators.json data/sector_valuation_cache.json data/market_valuation_history.json data/macro_valuation.json data/financials/
          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi dữ liệu vĩ mô mới."
          else
            git commit -m "chore(data): weekly macro & sector valuation sync [skip ci]"
            git push
            echo "✅ Đã commit và push dữ liệu vĩ mô mới lên GitHub thành công!"
          fi

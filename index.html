<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 Nhật Ký Giao Dịch</title>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('stock_theme_mode');
        var legacy = localStorage.getItem('stock_theme');
        var isDark = false;
        var supportDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (mode === 'dark' || (!mode && legacy === 'dark')) {
          isDark = true;
        } else if (mode === 'light' || (!mode && legacy === 'light')) {
          isDark = false;
        } else {
          // 'system' hoặc chưa chọn
          isDark = supportDark;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
